<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Harness · 工作包依赖 DAG</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(13, 27, 45, .92);
      --panel-strong: #10233a;
      --line: rgba(157, 185, 218, .2);
      --text: #edf5ff;
      --muted: #8fa6bf;
      --blue: #55a7ff;
      --cyan: #52e1d2;
      --green: #63db9b;
      --amber: #f6c66f;
      --violet: #ab8cff;
      --red: #ff7e8b;
      --shadow: 0 22px 60px rgba(0, 0, 0, .28);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 3%, rgba(61, 134, 255, .18), transparent 29rem),
        radial-gradient(circle at 92% 18%, rgba(82, 225, 210, .11), transparent 30rem),
        var(--bg);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(1680px, calc(100% - 32px)); margin: 0 auto; padding: 24px 0 48px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
    .brand { display: flex; gap: 12px; align-items: center; }
    .brand-mark {
      display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px;
      color: #04131e; font-weight: 900; background: linear-gradient(135deg, var(--cyan), var(--blue));
    }
    h1 { margin: 0; font-size: clamp(22px, 3vw, 34px); letter-spacing: -.035em; }
    .subtitle, .updated { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .updated { text-align: right; }

    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px;
      border: 1px solid var(--line); border-radius: 18px 18px 0 0; background: var(--panel);
    }
    .search, .btn {
      min-height: 40px; border: 1px solid var(--line); border-radius: 11px; color: var(--text); background: #0a1a2d;
    }
    .search { flex: 1 1 250px; padding: 0 12px; outline: none; }
    .search:focus { border-color: rgba(85, 167, 255, .7); box-shadow: 0 0 0 3px rgba(85, 167, 255, .12); }
    .btn { padding: 0 13px; font-size: 12px; font-weight: 700; }
    .btn:hover, .btn.active { border-color: rgba(85, 167, 255, .55); background: #123152; }
    .btn.active { color: #061725; background: linear-gradient(135deg, var(--cyan), var(--blue)); }
    .divider { width: 1px; height: 28px; background: var(--line); }
    .legend { display: flex; flex-wrap: wrap; gap: 11px; margin-left: auto; color: var(--muted); font-size: 11px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 11px; height: 11px; border-radius: 3px; box-shadow: 0 0 0 2px rgba(255, 255, 255, .06); }
    .dot.pending { background: #8293a6; }
    .dot.in-progress { background: var(--cyan); }
    .dot.ready-for-acceptance { background: var(--amber); }
    .dot.blocked { background: var(--red); }
    .dot.complete { background: var(--green); }

    .graph-frame {
      position: relative; min-height: 680px; overflow: auto; border: 1px solid var(--line); border-top: 0;
      border-radius: 0 0 20px 20px; background: rgba(5, 15, 27, .7); box-shadow: var(--shadow);
    }
    .graph-frame::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 28px 28px; opacity: .16;
    }
    svg { position: relative; display: block; min-width: 100%; }
    .edge { fill: none; stroke: rgba(143, 166, 191, .3); stroke-width: 1.4; transition: opacity .15s, stroke .15s, stroke-width .15s; }
    .edge.focus { stroke: var(--blue); stroke-width: 2.2; opacity: .95; }
    .edge.dimmed { opacity: .08; }
    .node { outline: none; transition: opacity .15s; }
    .node.dimmed { opacity: .16; }
    .node rect.node-bg { fill: #10233a; stroke: rgba(157, 185, 218, .35); stroke-width: 1.5; transition: stroke .15s, fill .15s, filter .15s; }
    .node[data-state="pending"] rect.node-bg { fill: #182638; stroke: #71869d; }
    .node[data-state="in_progress"] rect.node-bg { fill: #0d3942; stroke: var(--cyan); stroke-width: 2; filter: drop-shadow(0 0 8px rgba(82, 225, 210, .2)); }
    .node[data-state="ready_for_acceptance"] rect.node-bg { fill: #3d321b; stroke: var(--amber); stroke-width: 2; filter: drop-shadow(0 0 8px rgba(246, 198, 111, .2)); }
    .node[data-state="blocked"] rect.node-bg { fill: #421f2b; stroke: var(--red); stroke-width: 2; filter: drop-shadow(0 0 8px rgba(255, 126, 139, .2)); }
    .node[data-state="complete"] rect.node-bg { fill: #14382d; stroke: var(--green); stroke-width: 2; filter: drop-shadow(0 0 8px rgba(99, 219, 155, .18)); }
    .node:hover rect.node-bg, .node:focus rect.node-bg { stroke: #ffffff; stroke-width: 2.5; }
    .node.upstream rect.node-bg { stroke: var(--amber); stroke-width: 2.5; }
    .node.downstream rect.node-bg { stroke: var(--violet); stroke-width: 2.5; }
    .node.selected rect.node-bg { stroke: #ffffff; stroke-width: 3; filter: drop-shadow(0 0 13px rgba(255, 255, 255, .34)); }
    .node text { pointer-events: none; }
    .node-id { fill: var(--blue); font: 700 13px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .node-title { fill: var(--text); font-size: 12px; font-weight: 500; }
    .node-meta { fill: var(--muted); font-size: 10px; }
    .node-state.pending { fill: #b6c3d1; }
    .node-state.in_progress { fill: #7ef3e8; font-weight: 700; }
    .node-state.ready_for_acceptance { fill: #f8d795; font-weight: 700; }
    .node-state.blocked { fill: #ff9aa5; font-weight: 700; }
    .node-state.complete { fill: #8aebb4; font-weight: 700; }
    .wave-label { fill: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .11em; }
    .state-mark.pending { fill: #8293a6; }
    .state-mark.in_progress { fill: var(--cyan); }
    .state-mark.ready_for_acceptance { fill: var(--amber); }
    .state-mark.blocked { fill: var(--red); }
    .state-mark.complete { fill: var(--green); }

    .detail {
      display: grid; grid-template-columns: minmax(200px, 1fr) repeat(3, minmax(150px, .65fr)); gap: 14px;
      margin-top: 14px; padding: 17px 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel);
    }
    .detail h2 { margin: 4px 0 6px; font-size: 17px; }
    .detail p { margin: 0; color: #b1c5d9; font-size: 12px; line-height: 1.6; }
    .detail-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .detail-value { margin-top: 6px; color: #ddecfb; font-size: 12px; line-height: 1.55; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .error { margin: 20px; padding: 18px; color: #ffd1d6; border: 1px solid rgba(255, 126, 139, .35); border-radius: 12px; background: rgba(255, 126, 139, .08); }

    @media (max-width: 820px) {
      .shell { width: min(100% - 18px, 1680px); padding-top: 12px; }
      .topbar { display: block; }
      .updated { margin-top: 8px; text-align: left; }
      .legend { width: 100%; margin-left: 0; }
      .divider { display: none; }
      .detail { grid-template-columns: 1fr 1fr; }
      .detail-main { grid-column: 1 / -1; }
    }
    @media (max-width: 520px) {
      .detail { grid-template-columns: 1fr; }
      .detail-main { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">DAG</div>
        <div>
          <h1>工作包任务关系</h1>
          <div class="subtitle">箭头从直接前置工作包指向后继；横向层级按依赖深度自动计算。</div>
        </div>
      </div>
      <div class="updated" id="updated">正在加载工作包数据…</div>
    </header>

    <section class="toolbar" aria-label="DAG 控制栏">
      <input class="search" id="search" type="search" placeholder="搜索工作包 ID、名称、Lane 或标签">
      <button class="btn active" type="button" data-state="all">全部</button>
      <button class="btn" type="button" data-state="in_progress">进行中</button>
      <button class="btn" type="button" data-state="ready_for_acceptance">待验收</button>
      <button class="btn" type="button" data-state="pending">待开始</button>
      <button class="btn" type="button" data-state="blocked">阻塞</button>
      <button class="btn" type="button" data-state="complete">已完成</button>
      <span class="divider" aria-hidden="true"></span>
      <button class="btn" type="button" id="reset">重置聚焦</button>
      <div class="legend" aria-label="状态图例">
        <span><i class="dot pending"></i>待开始</span>
        <span><i class="dot in-progress"></i>进行中</span>
        <span><i class="dot ready-for-acceptance"></i>待验收</span>
        <span><i class="dot blocked"></i>阻塞</span>
        <span><i class="dot complete"></i>已完成</span>
      </div>
    </section>

    <section class="graph-frame" id="graphFrame" aria-label="工作包依赖图">
      <svg id="graph" role="img" aria-labelledby="graphTitle graphDesc"></svg>
    </section>

    <section class="detail" id="detail" aria-live="polite">
      <div class="detail-main">
        <div class="detail-label">当前选择</div>
        <h2>点击任一工作包查看依赖路径</h2>
        <p>选中后，高亮其全部上游和下游关系；黄色边框表示上游，紫色边框表示下游。</p>
      </div>
      <div><div class="detail-label">直接前置</div><div class="detail-value">—</div></div>
      <div><div class="detail-label">直接后继</div><div class="detail-value">—</div></div>
      <div><div class="detail-label">状态 / 波次</div><div class="detail-value">—</div></div>
    </section>
  </main>

  <script src="work-packages.js"></script>
  <script>
    (() => {
      const data = window.WORK_PACKAGES_DATA;
      const frame = document.querySelector("#graphFrame");
      const svg = document.querySelector("#graph");
      const detail = document.querySelector("#detail");
      const search = document.querySelector("#search");
      const reset = document.querySelector("#reset");
      const stateButtons = [...document.querySelectorAll("[data-state]")];
      const NS = "http://www.w3.org/2000/svg";
      const STATUS = { pending: "待开始", in_progress: "进行中", ready_for_acceptance: "待验收", blocked: "阻塞", complete: "已完成" };

      if (!data || !Array.isArray(data.workPackages)) {
        frame.innerHTML = '<div class="error" role="alert">无法加载 work-packages.js，请确认它与本页面位于同一目录。</div>';
        return;
      }

      const packages = data.workPackages;
      const byId = new Map(packages.map(item => [item.id, item]));
      const dependents = new Map(packages.map(item => [item.id, []]));
      const invalidDependencies = [];
      packages.forEach(item => (item.prerequisites || []).forEach(parentId => {
        if (dependents.has(parentId)) dependents.get(parentId).push(item.id);
        else invalidDependencies.push(`${item.id} → ${parentId}`);
      }));

      const depthMemo = new Map();
      const visiting = new Set();
      function depthOf(id) {
        if (depthMemo.has(id)) return depthMemo.get(id);
        if (visiting.has(id)) throw new Error(`检测到循环依赖：${id}`);
        visiting.add(id);
        const item = byId.get(id);
        const parents = (item?.prerequisites || []).filter(parentId => byId.has(parentId));
        const depth = parents.length ? 1 + Math.max(...parents.map(depthOf)) : 0;
        visiting.delete(id);
        depthMemo.set(id, depth);
        return depth;
      }

      let selectedId = null;
      let activeState = "all";
      const waveOrder = { A: 0, B: 1, C: 2, D: 3 };
      const columns = new Map();
      packages.forEach(item => {
        const depth = depthOf(item.id);
        if (!columns.has(depth)) columns.set(depth, []);
        columns.get(depth).push(item);
      });
      columns.forEach(items => items.sort((a, b) =>
        (waveOrder[a.wave] ?? 9) - (waveOrder[b.wave] ?? 9) || a.id.localeCompare(b.id)
      ));

      const NODE_W = 238;
      const NODE_H = 82;
      const COL_GAP = 88;
      const ROW_GAP = 24;
      const PAD_X = 70;
      const PAD_Y = 64;
      const maxDepth = Math.max(...columns.keys());
      const maxRows = Math.max(...[...columns.values()].map(items => items.length));
      const width = PAD_X * 2 + (maxDepth + 1) * NODE_W + maxDepth * COL_GAP;
      const height = Math.max(680, PAD_Y * 2 + maxRows * NODE_H + (maxRows - 1) * ROW_GAP);
      const positions = new Map();

      function createSvg(name, attrs = {}) {
        const element = document.createElementNS(NS, name);
        Object.entries(attrs).forEach(([key, value]) => element.setAttribute(key, value));
        return element;
      }

      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("width", width);
      svg.setAttribute("height", height);
      const title = createSvg("title", { id: "graphTitle" });
      title.textContent = "Super Harness 工作包依赖 DAG";
      const desc = createSvg("desc", { id: "graphDesc" });
      desc.textContent = `共 ${packages.length} 个工作包，箭头由直接前置任务指向后继任务。`;
      svg.append(title, desc);

      const defs = createSvg("defs");
      const marker = createSvg("marker", { id: "arrow", viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" });
      marker.appendChild(createSvg("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#67809b" }));
      defs.appendChild(marker);
      svg.appendChild(defs);

      [...columns.entries()].sort((a, b) => a[0] - b[0]).forEach(([depth, items]) => {
        const x = PAD_X + depth * (NODE_W + COL_GAP);
        const usedHeight = items.length * NODE_H + Math.max(0, items.length - 1) * ROW_GAP;
        const startY = Math.max(PAD_Y, (height - usedHeight) / 2);
        const label = createSvg("text", { x, y: 31, class: "wave-label" });
        label.textContent = `依赖层级 ${depth}`;
        svg.appendChild(label);
        items.forEach((item, index) => positions.set(item.id, { x, y: startY + index * (NODE_H + ROW_GAP) }));
      });

      const edgeLayer = createSvg("g", { "aria-hidden": "true" });
      const edges = [];
      packages.forEach(item => (item.prerequisites || []).forEach(parentId => {
        const from = positions.get(parentId);
        const to = positions.get(item.id);
        if (!from || !to) return;
        const x1 = from.x + NODE_W;
        const y1 = from.y + NODE_H / 2;
        const x2 = to.x;
        const y2 = to.y + NODE_H / 2;
        const bend = Math.max(34, (x2 - x1) * .46);
        const path = createSvg("path", {
          d: `M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}`,
          class: "edge",
          "marker-end": "url(#arrow)",
          "data-from": parentId,
          "data-to": item.id
        });
        edgeLayer.appendChild(path);
        edges.push(path);
      }));
      svg.appendChild(edgeLayer);

      const nodeLayer = createSvg("g");
      const nodeElements = new Map();
      packages.forEach(item => {
        const pos = positions.get(item.id);
        const group = createSvg("g", {
          class: "node",
          transform: `translate(${pos.x} ${pos.y})`,
          tabindex: "0",
          role: "button",
          "aria-label": `${item.id} ${item.title}，${STATUS[item.state] || item.state}，波次 ${item.wave}`,
          "data-id": item.id,
          "data-state": item.state
        });
        group.appendChild(createSvg("rect", { class: "node-bg", width: NODE_W, height: NODE_H, rx: "12" }));
        group.appendChild(createSvg("rect", { class: `state-mark ${item.state}`, x: "0", y: "0", width: "5", height: NODE_H, rx: "3" }));
        const idText = createSvg("text", { x: "16", y: "23", class: "node-id" });
        idText.textContent = item.id;
        const waveText = createSvg("text", { x: NODE_W - 16, y: "22", class: `node-meta node-state ${item.state}`, "text-anchor": "end" });
        waveText.textContent = `WAVE ${item.wave} · ${STATUS[item.state] || item.state}`;
        group.append(idText, waveText);

        const lines = wrapTitle(item.title, 17, 2);
        lines.forEach((line, index) => {
          const text = createSvg("text", { x: "16", y: 46 + index * 16, class: "node-title" });
          text.textContent = line;
          group.appendChild(text);
        });
        if ((item.tags || []).length) {
          const tagText = createSvg("text", { x: NODE_W - 16, y: NODE_H - 10, class: "node-meta", "text-anchor": "end" });
          tagText.textContent = item.tags.join(" · ");
          group.appendChild(tagText);
        }
        group.addEventListener("click", event => { event.stopPropagation(); selectNode(item.id); });
        group.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectNode(item.id); }
        });
        nodeLayer.appendChild(group);
        nodeElements.set(item.id, group);
      });
      svg.appendChild(nodeLayer);

      function wrapTitle(value, maxChars, maxLines) {
        const chars = [...String(value || "")];
        const lines = [];
        while (chars.length && lines.length < maxLines) lines.push(chars.splice(0, maxChars).join(""));
        if (chars.length) lines[maxLines - 1] = `${lines[maxLines - 1].slice(0, -1)}…`;
        return lines;
      }

      function traverse(startId, next) {
        const found = new Set();
        const queue = [...next(startId)];
        while (queue.length) {
          const id = queue.shift();
          if (found.has(id)) continue;
          found.add(id);
          queue.push(...next(id));
        }
        return found;
      }

      function selectNode(id) {
        selectedId = selectedId === id ? null : id;
        applyFocus();
        renderDetail();
      }

      function applyFocus() {
        const query = search.value.trim().toLocaleLowerCase("zh-CN");
        const upstream = selectedId ? traverse(selectedId, id => byId.get(id)?.prerequisites || []) : new Set();
        const downstream = selectedId ? traverse(selectedId, id => dependents.get(id) || []) : new Set();
        const pathIds = new Set([selectedId, ...upstream, ...downstream].filter(Boolean));
        const hasSelection = Boolean(selectedId);

        packages.forEach(item => {
          const haystack = [item.id, item.title, item.lane, ...(item.tags || [])].join(" ").toLocaleLowerCase("zh-CN");
          const matchesSearch = !query || haystack.includes(query);
          const matchesState = activeState === "all" || item.state === activeState;
          const matchesSelection = !hasSelection || pathIds.has(item.id);
          const node = nodeElements.get(item.id);
          node.classList.toggle("dimmed", !(matchesSearch && matchesState && matchesSelection));
          node.classList.toggle("selected", item.id === selectedId);
          node.classList.toggle("upstream", upstream.has(item.id));
          node.classList.toggle("downstream", downstream.has(item.id));
        });

        edges.forEach(edge => {
          const from = edge.dataset.from;
          const to = edge.dataset.to;
          const inPath = hasSelection && pathIds.has(from) && pathIds.has(to) && (upstream.has(from) || downstream.has(to));
          edge.classList.toggle("focus", inPath);
          edge.classList.toggle("dimmed", hasSelection && !inPath);
        });
      }

      function renderDetail() {
        if (!selectedId) {
          detail.innerHTML = `
            <div class="detail-main"><div class="detail-label">当前选择</div><h2>点击任一工作包查看依赖路径</h2><p>选中后，高亮其全部上游和下游关系；黄色边框表示上游，紫色边框表示下游。</p></div>
            <div><div class="detail-label">直接前置</div><div class="detail-value">—</div></div>
            <div><div class="detail-label">直接后继</div><div class="detail-value">—</div></div>
            <div><div class="detail-label">状态 / 波次</div><div class="detail-value">—</div></div>`;
          return;
        }
        const item = byId.get(selectedId);
        const directNext = dependents.get(selectedId) || [];
        detail.innerHTML = `
          <div class="detail-main"><div class="detail-label">${escapeHtml(item.id)} · ${escapeHtml(item.lane || "未设置 Lane")}</div><h2>${escapeHtml(item.title)}</h2><p>${escapeHtml(item.summary || item.exit || "暂无进展摘要。")}</p></div>
          <div><div class="detail-label">直接前置</div><div class="detail-value mono">${formatIds(item.prerequisites)}</div></div>
          <div><div class="detail-label">直接后继</div><div class="detail-value mono">${formatIds(directNext)}</div></div>
          <div><div class="detail-label">状态 / 波次</div><div class="detail-value">${escapeHtml(STATUS[item.state] || item.state)} · Wave ${escapeHtml(item.wave)}${(item.tags || []).length ? `<br>${escapeHtml(item.tags.join(" · "))}` : ""}</div></div>`;
      }

      function formatIds(ids) {
        return ids && ids.length ? ids.map(escapeHtml).join(" · ") : "无";
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]);
      }

      search.addEventListener("input", applyFocus);
      stateButtons.forEach(button => button.addEventListener("click", () => {
        activeState = button.dataset.state;
        stateButtons.forEach(candidate => candidate.classList.toggle("active", candidate === button));
        applyFocus();
      }));
      reset.addEventListener("click", () => {
        selectedId = null;
        activeState = "all";
        search.value = "";
        stateButtons.forEach(button => button.classList.toggle("active", button.dataset.state === "all"));
        applyFocus();
        renderDetail();
      });
      svg.addEventListener("click", event => {
        if (event.target === svg || event.target === edgeLayer) selectNode(selectedId);
      });

      document.querySelector("#updated").innerHTML = `数据更新：${escapeHtml(data.updatedAt || "未知")}<br>${packages.length} 个工作包 · ${edges.length} 条直接依赖${invalidDependencies.length ? ` · ${invalidDependencies.length} 条无效引用` : ""}`;
      applyFocus();
    })();
  </script>
</body>
</html>
